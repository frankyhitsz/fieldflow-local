name: verify

on:
  push:
    branches: [main]
  pull_request:

env:
  FIELDFLOW_RELEASE_SHA: ${{ github.sha }}

jobs:
  python-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock
            requirements-build.lock
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r requirements-dev.lock -r requirements-build.lock && .venv/bin/pip install -e . --no-deps --no-build-isolation
      - name: Check Python 3.11 compatibility
        run: |
          .venv/bin/python -m ruff check backend tests scripts
          .venv/bin/python -m pyright
          make test

  fieldflow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock
            requirements-build.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r requirements-dev.lock -r requirements-build.lock && .venv/bin/pip install -e . --no-deps --no-build-isolation
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run static checks
        run: make lock-check lint
      - name: Audit dependencies
        run: make audit
      - name: Test backend and API
        run: make test
      - name: Enforce safety mutation score
        run: make mutation-test
      - name: Test React components
        run: make test-frontend
      - name: Build frontend
        run: make build
      - name: Run demo check
        run: make demo-check
      - name: Check benchmark trend
        run: make benchmark
      - name: Verify long-history budget and installed distributions
        run: make history-benchmark distribution-check
      - name: Upload verified distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fieldflow-distributions
          path: |
            dist
            docs/sbom-runtime.cdx.json
          retention-days: 14
      - name: Run Playwright flow
        run: make test-e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            frontend/test-results
            frontend/playwright-report
            .mutation-results
          if-no-files-found: ignore
          retention-days: 7

  macos-compat:
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock
            requirements-build.lock
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r requirements-dev.lock -r requirements-build.lock && .venv/bin/pip install -e . --no-deps --no-build-isolation
      - name: Verify macOS runtime compatibility
        run: |
          .venv/bin/python -m ruff check backend tests scripts
          .venv/bin/python -m pyright
          make test
