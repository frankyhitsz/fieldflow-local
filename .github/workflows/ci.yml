name: verify

on:
  push:
    branches: [main]
  pull_request:

env:
  FIELDFLOW_BUILD_SHA: ${{ github.sha }}

jobs:
  python-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt
      - name: Check Python 3.11 compatibility
        run: |
          .venv/bin/python -m ruff check backend tests scripts
          .venv/bin/python -m pyright
          make test

  fieldflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run static checks
        run: make lint
      - name: Audit dependencies
        run: make audit
      - name: Test backend and API
        run: make test
      - name: Test React components
        run: make test-frontend
      - name: Build frontend
        run: make build
      - name: Run demo check
        run: make demo-check
      - name: Run benchmark smoke
        run: make benchmark-smoke
      - name: Run Playwright flow
        run: make test-e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
