[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldflow-local"
dynamic = ["version"]
description = "Local field-service scheduling with FastAPI and React"
requires-python = ">=3.11"
classifiers = [
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.52.4",
  "ortools==9.15.6755",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
  "hypothesis==6.138.15",
  "pyright==1.1.411",
  "pip-audit==2.10.1",
]

[tool.pyright]
include = ["backend", "scripts"]
strict = ["backend/hashing.py", "backend/provenance.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.setuptools.dynamic]
version = {attr = "backend._version.__version__"}

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
